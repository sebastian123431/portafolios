{% load static %}
<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Portafolio - {{ name }}</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{% static 'portafoliosapp/css/style.css' %}">
</head>
<body>
  <script>var BUBBLES = {{ bubbles_json|safe }};</script>

  <section id="universe" class="universe">
    <canvas id="stars"></canvas>
    <div id="bubble-scene" class="bubble-scene" aria-hidden="false"></div>
    <div id="detail-panel" class="detail-panel" aria-hidden="true">
      <button id="close-detail" aria-label="Cerrar">✕</button>
      <div id="detail-content"></div>
    </div>
  </section>

  <main class="cv-container">
    <!-- Header removed: interactive universe is the main view -->
  </main>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/animejs/3.2.1/anime.min.js"></script>
  <script src="{% static 'portafoliosapp/js/main.js' %}"></script>
</body>
</html>
