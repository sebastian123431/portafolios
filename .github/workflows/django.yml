name: Django CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Descargar código del repositorio
      uses: actions/checkout@v4

    - name: Configurar versión de Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
        cache: 'pip'

    - name: Instalar dependencias del sistema (para OpenCV)
      run: |
        sudo apt-get update
        sudo apt-get install -y libgl1 libglib2.0-0

    - name: Instalar paquetes de requirements.txt
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Verificar configuración de Django y base de datos
      env:
        DJANGO_DEBUG: "True"
        DJANGO_SECRET_KEY: "ci-secret-key-para-pruebas-automaticas"
      run: |
        python manage.py check
        python manage.py migrate

    - name: Ejecutar batería de 51 tests automáticos
      env:
        DJANGO_DEBUG: "True"
        DJANGO_SECRET_KEY: "ci-secret-key-para-pruebas-automaticas"
      run: |
        python manage.py test
